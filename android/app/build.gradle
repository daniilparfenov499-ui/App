plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danillons.calc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.danillons.calc'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Веб-часть (index.html, css, js, ...) лежит в корне репозитория.
// Перед сборкой копируем её в assets приложения.
tasks.register('copyWeb', Copy) {
    from("${rootDir}/..") {
        include 'index.html', 'manifest.webmanifest', 'sw.js', 'css/**', 'js/**', 'icons/**'
    }
    into "${projectDir}/src/main/assets/www"
}

tasks.named('preBuild') {
    dependsOn 'copyWeb'
}
