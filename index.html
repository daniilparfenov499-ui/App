<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Danillons Calc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>Danillons Calc</title>
</head>
<body>

<div id="calc">
  <div id="display"><div id="expr"></div><div id="res">0</div></div>
  <div class="keys">
    <button class="fn" data-k="C">AC</button><button class="fn" data-k="B">⌫</button><button class="fn" data-k="%">%</button><button class="op" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button class="zero" data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="=">=</button>
  </div>
</div>

<div id="gallery">
  <div class="bar">
    <h1>Danillons Vault</h1>
    <label>＋ Добавить<input id="file" type="file" accept="image/*,video/*" multiple hidden></label>
    <button class="gray" id="setcode">Код</button>
    <button class="red" id="lock">Закрыть</button>
  </div>
  <div id="grid"></div>
  <div id="empty">Пусто. Добавьте фото или видео.</div>
</div>

<div id="viewer">
  <div class="bar"><h1 id="vname"></h1><button class="red" id="vdel">Удалить</button><button class="gray" id="vclose">Назад</button></div>
  <div id="vbody"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
